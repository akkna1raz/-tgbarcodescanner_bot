<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Сканер штрихкодов</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: pan-x pan-y;
    }

    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --hint-color: var(--tg-theme-hint-color, #94a3b8);
      --button-color: var(--tg-theme-button-color, #2563eb);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .theme-card { background-color: var(--card-bg); }
    .theme-btn { background-color: var(--button-color); color: var(--button-text-color); }
    .theme-hint { color: var(--hint-color); }

    .camera-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 4 / 3;
      max-height: 270px;
      touch-action: none;
    }

    #native-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1rem;
    }

    #reader {
      border: none !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 1rem;
    }

    #reader__scan_region,
    #reader__scan_region * {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    #qr-shaded-region,
    #reader__scan_region svg,
    #reader__scan_region img,
    #reader__dashboard_section_csr,
    #reader__header_message,
    #reader__status_span {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .corner-mark {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #38bdf8;
      pointer-events: none;
    }

    @keyframes scan-laser {
      0% { top: 8%; opacity: 0.8; }
      50% { top: 88%; opacity: 1; }
      100% { top: 8%; opacity: 0.8; }
    }

    .scanner-laser {
      position: absolute;
      left: 2%;
      right: 2%;
      height: 2.5px;
      background: linear-gradient(90deg, rgba(56,189,248,0) 0%, rgba(56,189,248,0.95) 20%, #38bdf8 50%, rgba(56,189,248,0.95) 80%, rgba(56,189,248,0) 100%);
      box-shadow: 0 0 12px 2.5px rgba(56, 189, 248, 0.9);
      border-radius: 9999px;
      animation: scan-laser 1.4s ease-in-out infinite;
      pointer-events: none;
    }

    .animate-enter {
      animation: enter-motion 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes enter-motion {
      0% { opacity: 0; transform: translateY(6px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="p-4 flex flex-col items-center justify-start min-h-screen">

  <div class="w-full max-w-sm flex flex-col items-center">

    <header class="text-center my-2">
      <h1 class="text-xl font-bold tracking-tight">Сканер товаров</h1>
      <p class="text-xs theme-hint mt-0.5">Поместите штрихкод в рамку</p>
    </header>

    <div id="scanner-wrapper" class="camera-container relative rounded-2xl overflow-hidden shadow-lg border border-slate-700/60 my-2 flex items-center justify-center bg-slate-950">
      <video id="native-video" class="hidden" playsinline muted autoplay></video>
      <div id="reader" class="hidden w-full h-full"></div>

      <button id="btn-torch" type="button" class="hidden absolute top-3 right-3 z-30 w-10 h-10 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center border border-white/20 active:scale-90 transition-transform shadow-md" title="Фонарик">
        <svg id="torch-off-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <svg id="torch-on-icon" class="w-5 h-5 hidden text-amber-400 fill-amber-400" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </button>

      <div id="zoom-badge" class="hidden absolute top-3 left-3 z-30 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-[11px] font-mono font-bold text-sky-400 border border-sky-500/30">
        1.0x
      </div>

      <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center bg-slate-900/95 text-white z-20">
        <div id="placeholder-idle" class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center mb-3">
            <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
          </div>
          <button id="btn-start-scan" class="theme-btn px-6 py-2.5 rounded-xl text-xs font-semibold shadow-md active:scale-95 transition-all flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Сканировать
          </button>
        </div>

        <div id="placeholder-loading" class="hidden flex flex-col items-center">
          <div class="w-7 h-7 border-2 border-sky-400 border-t-transparent rounded-full animate-spin mb-2"></div>
          <p class="text-xs text-slate-200">Включение камеры…</p>
        </div>
      </div>

      <div id="scanner-overlay" class="hidden absolute inset-0 pointer-events-none z-10 flex items-center justify-center p-3">
        <div class="relative w-[86%] aspect-[2.4/1] max-h-[50%]">
          <div class="corner-mark top-0 left-0 border-t-[3.5px] border-l-[3.5px] rounded-tl-lg"></div>
          <div class="corner-mark top-0 right-0 border-t-[3.5px] border-r-[3.5px] rounded-tr-lg"></div>
          <div class="corner-mark bottom-0 left-0 border-b-[3.5px] border-l-[3.5px] rounded-bl-lg"></div>
          <div class="corner-mark bottom-0 right-0 border-b-[3.5px] border-r-[3.5px] rounded-br-lg"></div>
          <div class="scanner-laser"></div>
        </div>
      </div>
    </div>

    <div id="loading-state" class="hidden my-4 flex flex-col items-center animate-enter">
      <div class="w-7 h-7 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs theme-hint mt-2 font-medium">Поиск в базах РФ и мира…</p>
    </div>

    <div id="network-error-card" class="hidden w-full theme-card rounded-2xl p-5 shadow-md mt-2 text-center border border-red-800/40 animate-enter">
      <div class="w-11 h-11 rounded-full bg-red-950/50 text-red-400 border border-red-800/40 mx-auto flex items-center justify-center mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-12.536a5 5 0 017.072 0m0 0l-2.829 2.829" />
        </svg>
      </div>
      <h3 id="network-error-title" class="text-sm font-bold text-red-400">Ошибка соединения</h3>
      <p id="network-error-desc" class="text-xs theme-hint mt-1 mb-4">Проверьте подключение к интернету</p>
      <button id="btn-retry-network" class="theme-btn px-5 py-2 rounded-xl text-xs font-semibold shadow-md active:scale-95 transition-all">
        Повторить запрос
      </button>
    </div>

    <div id="error-message" class="hidden w-full max-w-sm mt-3 p-3 bg-red-950/50 border border-red-800/70 rounded-xl text-red-400 text-xs text-center font-medium animate-enter"></div>

    <div id="result-card" class="hidden w-full theme-card rounded-2xl p-4 shadow-md mt-2 border border-slate-700/60 animate-enter">
      <div class="flex items-start gap-3.5">
        <div class="w-20 h-20 rounded-xl bg-slate-800 flex-shrink-0 overflow-hidden flex items-center justify-center border border-slate-700">
          <img id="res-image" src="" alt="Фото товара" class="w-full h-full object-contain hidden" />
          <svg id="res-image-placeholder" class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
        </div>

        <div class="flex-1 min-w-0">
          <span id="res-brand" class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800/50 mb-1 truncate max-w-full">
            Бренд
          </span>
          <h2 id="res-title" class="text-sm font-bold leading-snug line-clamp-2">
            Название товара
          </h2>
          <p id="res-category" class="text-xs theme-hint mt-1 truncate">
            Категория
          </p>
        </div>
      </div>

      <div class="mt-3 pt-3 border-t border-slate-700/60 flex flex-col gap-1.5 text-xs">
        <div id="res-extra-row" class="hidden items-center justify-between text-xs">
          <span class="theme-hint">Инфо:</span>
          <span id="res-extra" class="font-medium truncate max-w-[200px]">—</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="theme-hint">Штрихкод:</span>
          <button id="res-barcode-btn" type="button" class="font-mono font-bold bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all px-2.5 py-0.5 rounded text-sky-400 flex items-center gap-1.5" title="Скопировать">
            <span id="res-barcode">—</span>
            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="not-found-card" class="hidden w-full theme-card rounded-2xl p-5 shadow-md mt-2 text-center border border-slate-700/60 animate-enter">
      <div class="w-11 h-11 rounded-full bg-amber-950/50 text-amber-400 border border-amber-800/40 mx-auto flex items-center justify-center mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h3 id="nf-title" class="text-sm font-bold">Товар не найден</h3>
      <p class="text-xs theme-hint mt-1 mb-3">Штрихкод корректен, но товар пока отсутствует в базах</p>
      
      <button id="nf-barcode-btn" type="button" class="inline-flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all rounded-lg px-3 py-1.5 font-mono text-xs font-bold tracking-wider text-slate-300" title="Скопировать">
        <span id="nf-barcode">—</span>
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      </button>
    </div>

    <div id="action-buttons" class="w-full mt-4 hidden animate-enter">
      <button id="btn-rescan" class="w-full theme-btn py-3 rounded-xl text-xs font-semibold shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Сканировать другой товар
      </button>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (typeof tg.disableVerticalSwipes === 'function') {
        tg.disableVerticalSwipes();
      }
    }

    function triggerHaptic(type = 'success') {
      try {
        if (!tg?.HapticFeedback) return;
        if (type === 'light' || type === 'medium') {
          tg.HapticFeedback.impactOccurred(type);
        } else if (['success', 'warning', 'error'].includes(type)) {
          tg.HapticFeedback.notificationOccurred(type);
        }
      } catch (e) {}
    }

    const scannerWrapper = document.getElementById('scanner-wrapper');
    const nativeVideo = document.getElementById('native-video');
    const readerContainer = document.getElementById('reader');
    const placeholder = document.getElementById('scanner-placeholder');
    const placeholderIdle = document.getElementById('placeholder-idle');
    const placeholderLoading = document.getElementById('placeholder-loading');
    const scannerOverlay = document.getElementById('scanner-overlay');
    const btnStartScan = document.getElementById('btn-start-scan');
    const btnRescan = document.getElementById('btn-rescan');
    const btnTorch = document.getElementById('btn-torch');
    const zoomBadge = document.getElementById('zoom-badge');
    const torchOffIcon = document.getElementById('torch-off-icon');
    const torchOnIcon = document.getElementById('torch-on-icon');
    const loadingState = document.getElementById('loading-state');
    const errorMessage = document.getElementById('error-message');
    const resultCard = document.getElementById('result-card');
    const notFoundCard = document.getElementById('not-found-card');
    const networkErrorCard = document.getElementById('network-error-card');
    const networkErrorTitle = document.getElementById('network-error-title');
    const networkErrorDesc = document.getElementById('network-error-desc');
    const btnRetryNetwork = document.getElementById('btn-retry-network');
    const actionButtons = document.getElementById('action-buttons');

    const resImage = document.getElementById('res-image');
    const resImagePlaceholder = document.getElementById('res-image-placeholder');
    const resBrand = document.getElementById('res-brand');
    const resTitle = document.getElementById('res-title');
    const resCategory = document.getElementById('res-category');
    const resBarcode = document.getElementById('res-barcode');
    const resBarcodeBtn = document.getElementById('res-barcode-btn');
    const resExtraRow = document.getElementById('res-extra-row');
    const resExtra = document.getElementById('res-extra');
    const nfBarcode = document.getElementById('nf-barcode');
    const nfBarcodeBtn = document.getElementById('nf-barcode-btn');

    let mediaStream = null;
    let videoTrack = null;
    let html5QrCode = null;
    let isScanning = false;
    let isStarting = false;
    let isProcessing = false;
    let barcodeDetector = null;
    let nativeScanTimer = null;
    let roiCanvas = null;
    let roiCtx = null;
    let lastScannedCode = '';

    let isTorchSupported = false;
    let isTorchOn = false;
    let currentZoom = 1.0;
    let minZoom = 1.0;
    let maxZoom = 1.0;
    let hasHardwareZoom = false;

    let initialPinchDist = null;
    let startZoomOnPinch = 1.0;
    let hideZoomBadgeTimer = null;

    let candidateCode = '';
    let candidateHits = 0;

    function isValidEAN13(code) {
      if (!/^\d{13}$/.test(code)) return false;
      const digits = code.split('').map(Number);
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        sum += (i % 2 === 0) ? digits[i] : digits[i] * 3;
      }
      return ((10 - (sum % 10)) % 10) === digits[12];
    }

    function isValidEAN8(code) {
      if (!/^\d{8}$/.test(code)) return false;
      const digits = code.split('').map(Number);
      let sum = 0;
      for (let i = 0; i < 7; i++) {
        sum += (i % 2 === 0) ? digits[i] * 3 : digits[i];
      }
      return ((10 - (sum % 10)) % 10) === digits[7];
    }

    function isValidUPCA(code) {
      if (!/^\d{12}$/.test(code)) return false;
      const digits = code.split('').map(Number);
      let sum = 0;
      for (let i = 0; i < 11; i++) {
        sum += (i % 2 === 0) ? digits[i] * 3 : digits[i];
      }
      return ((10 - (sum % 10)) % 10) === digits[11];
    }

    function isValidBarcode(rawCode) {
      const clean = String(rawCode || '').trim();
      if (!clean) return false;
      if (clean.length === 13) return isValidEAN13(clean);
      if (clean.length === 8) return isValidEAN8(clean);
      if (clean.length === 12) return isValidUPCA(clean);
      return clean.length >= 4;
    }

    function formatBarcodeDisplay(code) {
      if (!code) return '';
      const clean = String(code).trim();
      if (clean.length === 13) return `${clean[0]} ${clean.substring(1, 7)} ${clean.substring(7)}`;
      if (clean.length === 12) return `${clean[0]} ${clean.substring(1, 6)} ${clean.substring(6, 11)} ${clean[11]}`;
      if (clean.length === 8) return `${clean.substring(0, 4)} ${clean.substring(4)}`;
      return clean;
    }

    async function initBarcodeDetectorEngine() {
      if (!('BarcodeDetector' in window)) return false;
      try {
        const supported = await BarcodeDetector.getSupportedFormats();
        if (!Array.isArray(supported)) return false;

        const essentialFormats = ['ean_13', 'ean_8', 'upc_a'];
        const hasEssential = essentialFormats.some(f => supported.includes(f));
        if (!hasEssential) {
          return false;
        }

        const needed = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'qr_code'];
        const available = needed.filter(f => supported.includes(f));
        if (available.length > 0) {
          barcodeDetector = new BarcodeDetector({ formats: available });
          return true;
        }
      } catch (e) {}
      return false;
    }

    async function startScanner() {
      if (isStarting || isScanning) return;
      isStarting = true;
      isProcessing = false;

      candidateCode = '';
      candidateHits = 0;

      hideAllCards();
      setPlaceholderState('loading');

      const hasNative = await initBarcodeDetectorEngine();

      if (hasNative) {
        await startNativeScanner();
      } else {
        await startFallbackScanner();
      }
    }

    async function startNativeScanner() {
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e) {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: 'environment' }
          });
        }

        nativeVideo.srcObject = mediaStream;
        await nativeVideo.play();

        videoTrack = mediaStream.getVideoTracks()[0];
        setupHardwareControls(videoTrack);

        nativeVideo.classList.remove('hidden');
        readerContainer.classList.add('hidden');
        scannerOverlay.classList.remove('hidden');
        setPlaceholderState('hidden');
        isScanning = true;
        isStarting = false;

        if (!roiCanvas) {
          roiCanvas = document.createElement('canvas');
          roiCtx = roiCanvas.getContext('2d', { willReadFrequently: true });
        }

        if (nativeScanTimer) clearInterval(nativeScanTimer);
        nativeScanTimer = setInterval(scanNativeRoiFrame, 75);

      } catch (err) {
        console.warn('Native stream error, fallback...', err);
        await startFallbackScanner();
      }
    }

    async function scanNativeRoiFrame() {
      if (!isScanning || isProcessing || !barcodeDetector || nativeVideo.readyState < 2) return;

      const vw = nativeVideo.videoWidth;
      const vh = nativeVideo.videoHeight;
      if (!vw || !vh) return;

      const cropW = Math.floor(vw * 0.85);
      const cropH = Math.floor(cropW / 2.4);
      const startX = Math.floor((vw - cropW) / 2);
      const startY = Math.floor((vh - cropH) / 2);

      if (roiCanvas.width !== cropW || roiCanvas.height !== cropH) {
        roiCanvas.width = cropW;
        roiCanvas.height = cropH;
      }

      roiCtx.drawImage(nativeVideo, startX, startY, cropW, cropH, 0, 0, cropW, cropH);

      try {
        const barcodes = await barcodeDetector.detect(roiCanvas);
        if (barcodes && barcodes.length > 0) {
          for (const item of barcodes) {
            const rawVal = String(item.rawValue || '').trim();
            if (isValidBarcode(rawVal)) {
              if (rawVal === candidateCode) {
                candidateHits++;
                if (candidateHits >= 2) {
                  candidateCode = '';
                  candidateHits = 0;
                  onCodeDetected(rawVal);
                  break;
                }
              } else {
                candidateCode = rawVal;
                candidateHits = 1;
              }
            }
          }
        } else {
          candidateHits = 0;
        }
      } catch (e) {}
    }

    async function startFallbackScanner() {
      nativeVideo.classList.add('hidden');
      readerContainer.classList.remove('hidden');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });
      }

      const scanConfig = {
        fps: 25,
        qrbox: (w, h) => {
          const width = Math.floor((w || 320) * 0.86);
          const height = Math.min(Math.floor(width / 2.4), Math.floor((h || 240) * 0.5));
          return { width, height };
        },
        disableFlip: true
      };

      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          scanConfig,
          (decodedText) => {
            const rawVal = String(decodedText || '').trim();
            if (isValidBarcode(rawVal)) {
              if (rawVal === candidateCode) {
                candidateHits++;
                if (candidateHits >= 2) {
                  candidateCode = '';
                  candidateHits = 0;
                  onCodeDetected(rawVal);
                }
              } else {
                candidateCode = rawVal;
                candidateHits = 1;
              }
            }
          },
          () => {}
        );

        isScanning = true;
        isStarting = false;
        scannerOverlay.classList.remove('hidden');
        setPlaceholderState('hidden');

        setTimeout(() => {
          const video = document.querySelector('#reader video');
          if (video && video.srcObject) {
            const track = video.srcObject.getVideoTracks()[0];
            if (track) setupHardwareControls(track);
          }
        }, 400);

      } catch (err) {
        isStarting = false;
        isScanning = false;
        handleCameraError(err);
      }
    }

    async function onCodeDetected(code) {
      if (isProcessing) return;
      isProcessing = true;
      lastScannedCode = code;

      try {
        triggerHaptic('success');
        await stopScanner(false);
        loadingState.classList.remove('hidden');
        await fetchProductData(code);
      } catch (err) {
        console.error('Error during barcode detection handling:', err);
        loadingState.classList.add('hidden');
        renderNetworkError('Ошибка обработки', 'Произошла непредвиденная ошибка при чтении кода.');
      } finally {
        isProcessing = false;
      }
    }

    async function stopScanner(resetToIdle = true) {
      isStarting = false;
      isScanning = false;
      if (nativeScanTimer) {
        clearInterval(nativeScanTimer);
        nativeScanTimer = null;
      }

      if (isTorchOn && videoTrack) {
        try { await videoTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      videoTrack = null;

      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) {
            await html5QrCode.stop();
          }
          await html5QrCode.clear();
        } catch (e) {}
        html5QrCode = null;
      }

      hideTorchUi();
      zoomBadge.classList.add('hidden');
      scannerOverlay.classList.add('hidden');

      if (resetToIdle) setPlaceholderState('idle');
      else setPlaceholderState('hidden');
    }

    function setupHardwareControls(track) {
      videoTrack = track;
      try {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};

        if (capabilities.torch) {
          isTorchSupported = true;
          btnTorch.classList.remove('hidden');
        } else {
          hideTorchUi();
        }

        if (capabilities.zoom) {
          hasHardwareZoom = true;
          minZoom = capabilities.zoom.min || 1.0;
          maxZoom = Math.min(capabilities.zoom.max || 5.0, 5.0);
          currentZoom = minZoom;
        } else {
          hasHardwareZoom = false;
        }
      } catch (e) {
        hideTorchUi();
      }
    }

    async function applyZoom(val) {
      if (!videoTrack || !hasHardwareZoom) return;
      const target = Math.max(minZoom, Math.min(val, maxZoom));
      currentZoom = target;
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
        showZoomBadge(target);
      } catch (e) {}
    }

    function showZoomBadge(val) {
      zoomBadge.textContent = `${val.toFixed(1)}x`;
      zoomBadge.classList.remove('hidden');
      clearTimeout(hideZoomBadgeTimer);
      hideZoomBadgeTimer = setTimeout(() => zoomBadge.classList.add('hidden'), 1200);
    }

    scannerWrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2 && hasHardwareZoom) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        startZoomOnPinch = currentZoom;
      }
    }, { passive: true });

    scannerWrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist && hasHardwareZoom) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialPinchDist;
        applyZoom(startZoomOnPinch * factor);
      }
    }, { passive: true });

    scannerWrapper.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
    }, { passive: true });

    async function toggleTorch() {
      if (!videoTrack || !isTorchSupported) return;
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        updateTorchUi();
        triggerHaptic('light');
      } catch (e) {
        isTorchOn = false;
        updateTorchUi();
      }
    }

    function updateTorchUi() {
      if (isTorchOn) {
        torchOffIcon.classList.add('hidden');
        torchOnIcon.classList.remove('hidden');
        btnTorch.classList.add('bg-amber-500/30', 'border-amber-400', 'text-amber-400');
        btnTorch.classList.remove('bg-black/60', 'border-white/20', 'text-white');
      } else {
        torchOnIcon.classList.add('hidden');
        torchOffIcon.classList.remove('hidden');
        btnTorch.classList.remove('bg-amber-500/30', 'border-amber-400', 'text-amber-400');
        btnTorch.classList.add('bg-black/60', 'border-white/20', 'text-white');
      }
    }

    function hideTorchUi() {
      btnTorch.classList.add('hidden');
      isTorchOn = false;
      updateTorchUi();
    }

    async function fetchProductData(barcode) {
      if (!navigator.onLine) {
        loadingState.classList.add('hidden');
        renderNetworkError('Нет подключения к интернету', 'Включите Wi-Fi или мобильные данные и повторите попытку.');
        return;
      }

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 7000);

        const res = await fetch(`/api/product?barcode=${encodeURIComponent(barcode)}&_t=${Date.now()}`, {
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        clearTimeout(timer);

        loadingState.classList.add('hidden');

        if (res.status === 503 || res.status === 504) {
          renderNetworkError('Сервер временно недоступен', 'Внешние базы данных не ответили вовремя. Попробуйте еще раз.');
          return;
        }

        if (!res.ok) {
          renderNetworkError('Ошибка сервера', `Код ошибки: ${res.status}. Повторите попытку.`);
          return;
        }

        const data = await res.json();

        if (data && data.found) {
          renderProduct(data);
          triggerHaptic('success');
        } else {
          renderNotFound(barcode);
        }

      } catch (err) {
        loadingState.classList.add('hidden');
        renderNetworkError('Таймаут соединения', 'Не удалось связаться с сервером. Проверьте стабильность связи.');
      }
    }

    function renderProduct(item) {
      resTitle.textContent = item.name;
      resBrand.textContent = item.brand || 'Бренд не указан';
      resCategory.textContent = item.category || 'Товары общего назначения';
      resBarcode.textContent = formatBarcodeDisplay(item.barcode);

      if (item.extra) {
        resExtra.textContent = item.extra;
        resExtraRow.classList.remove('hidden');
        resExtraRow.classList.add('flex');
      } else {
        resExtraRow.classList.add('hidden');
        resExtraRow.classList.remove('flex');
      }

      if (item.image) {
        resImage.onerror = () => {
          resImage.classList.add('hidden');
          resImagePlaceholder.classList.remove('hidden');
        };
        resImage.src = item.image;
        resImage.classList.remove('hidden');
        resImagePlaceholder.classList.add('hidden');
      } else {
        resImage.classList.add('hidden');
        resImagePlaceholder.classList.remove('hidden');
      }

      resultCard.classList.remove('hidden');
      actionButtons.classList.remove('hidden');
    }

    function renderNotFound(barcode) {
      nfBarcode.textContent = formatBarcodeDisplay(barcode);
      notFoundCard.classList.remove('hidden');
      actionButtons.classList.remove('hidden');
      triggerHaptic('warning');
    }

    function renderNetworkError(title, desc) {
      networkErrorTitle.textContent = title;
      networkErrorDesc.textContent = desc;
      networkErrorCard.classList.remove('hidden');
      actionButtons.classList.remove('hidden');
      triggerHaptic('error');
    }

    function hideAllCards() {
      hideError();
      resultCard.classList.add('hidden');
      notFoundCard.classList.add('hidden');
      networkErrorCard.classList.add('hidden');
      actionButtons.classList.add('hidden');
      loadingState.classList.add('hidden');
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        triggerHaptic('medium');
      } catch (e) {}
    }

    resBarcodeBtn.addEventListener('click', () => copyToClipboard(lastScannedCode));
    nfBarcodeBtn.addEventListener('click', () => copyToClipboard(lastScannedCode));

    btnRetryNetwork.addEventListener('click', () => {
      if (lastScannedCode) {
        networkErrorCard.classList.add('hidden');
        loadingState.classList.remove('hidden');
        fetchProductData(lastScannedCode);
      } else {
        startScanner();
      }
    });

    function setPlaceholderState(state) {
      if (state === 'loading') {
        placeholderIdle.classList.add('hidden');
        placeholderLoading.classList.remove('hidden');
        placeholder.classList.remove('hidden');
      } else if (state === 'idle') {
        placeholderLoading.classList.add('hidden');
        placeholderIdle.classList.remove('hidden');
        placeholder.classList.remove('hidden');
      } else {
        placeholder.classList.add('hidden');
      }
    }

    function hideError() {
      errorMessage.classList.add('hidden');
      errorMessage.textContent = '';
    }

    function handleCameraError(err) {
      let message = 'Не удалось запустить камеру.';
      const errStr = String(err).toLowerCase();

      if (err?.name === 'NotAllowedError' || errStr.includes('permission') || errStr.includes('denied')) {
        message = 'Доступ к камере запрещен. Разрешите использование камеры в Telegram.';
      } else if (err?.name === 'NotFoundError' || errStr.includes('not found')) {
        message = 'Камера на устройстве не найдена.';
      } else if (err?.name === 'NotReadableError' || errStr.includes('busy')) {
        message = 'Камера занята другим приложением.';
      }

      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      actionButtons.classList.add('hidden');
      setPlaceholderState('idle');
      triggerHaptic('error');
    }

    btnStartScan.addEventListener('click', startScanner);
    btnRescan.addEventListener('click', startScanner);
    btnTorch.addEventListener('click', toggleTorch);

    document.addEventListener('visibilitychange', async () => {
      if (document.hidden && isScanning) await stopScanner(true);
    });

    window.addEventListener('pagehide', async () => {
      if (isScanning) await stopScanner(true);
    });
  </script>
</body>
